[project]
name = "farm-app-template"
version = "2.1.1"
description = "A FARM (FastAPI, React, MongoDB) stack template"
requires-python = ">=3.13"
license = "MIT"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pymongo>=4.16",
    "pydantic[email]>=2.10",
    "PyYAML>=6.0",
    "python-multipart>=0.0.18",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0",
]

# Installed by `uv sync`, left out by `uv sync --no-dev` (the Docker image).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "coverage>=7.0",
]

# No [build-system]: this is an app run from source (`uvicorn main:app`), not an
# installable package, so uv installs only the dependencies.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E226", "E302"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
