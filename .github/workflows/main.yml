name: Lint, Test and Build CI

on:
  pull_request:

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (Python version from .python-version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked --no-build

      - name: Lint with ruff
        run: uv run --locked --no-build ruff check .

      - name: Check formatting with ruff
        run: uv run --locked --no-build ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (Python version from .python-version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked --no-build

      - name: Run tests with coverage
        run: uv run --locked --no-build coverage run --source . --omit 'venv/*,tests/*' -m pytest

      - name: Generate coverage report
        run: uv run --locked --no-build coverage report --omit='venv/*,tests/*'

      - name: Generate coverage XML
        run: uv run --locked --no-build coverage xml -o coverage.xml --omit='venv/*,tests/*'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint with ESLint
        run: npm run lint

      - name: Build with Vite
        run: npm run build

  docker-build:
    needs: [test, client]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        run: docker build --file Dockerfile --tag farm-app-test .

      - name: Smoke test (container turns healthy, serves /health and the SPA)
        run: |
          docker run -d --name smoke -p 8000:8000 farm-app-test
          status=starting
          for _ in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            if [ "$status" = "healthy" ]; then break; fi
            sleep 3
          done
          echo "health: $status"
          if [ "$status" != "healthy" ]; then
            docker logs smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker rm -f smoke
